name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The tag is the version. Without it build.ps1 stamps the runner's UTC clock,
      # which put 2026.10.07.0524 on a release tagged 2026.10.06.2223.
      - name: Derive version from tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{4}$') { throw "Tag $tag is not YYYY.MM.DD.HHMM" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag -> Version: $version"

      - name: Build (unsigned)
        shell: pwsh
        run: .\build.ps1 -NoSign -Version '${{ steps.tag.outputs.version }}'

      # Every binary and the MSI must carry the tag. Windows Installer keeps only three
      # fields with a major of 255 or less, so cimipkg maps the date into
      # ProductVersion and keeps the whole tag in CIMIAN_PKG_FULL_VERSION.
      - name: Verify every version matches the tag
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $expected = [version]$version
          $failures = @()

          $zip = Get-ChildItem -Path release -Filter "ReportMate-$version.zip" | Select-Object -First 1
          if (-not $zip) { throw "No ReportMate-$version.zip produced by build.ps1" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'version-check'
          Remove-Item $unpacked -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $unpacked

          foreach ($exe in 'managedreportsrunner.exe', 'Managed Reports Runner.exe', 'usagetracker.exe') {
            $file = Get-ChildItem -Path $unpacked -Recurse -Filter $exe | Select-Object -First 1
            if (-not $file) { $failures += "$exe not found in $($zip.Name)"; continue }
            $info = $file.VersionInfo
            $fileVersion = [version]::new($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart)
            $productVersion = [version](($info.ProductVersion -split '\+')[0])
            if ($fileVersion -ne $expected) { $failures += "$exe file version $fileVersion" }
            if ($productVersion -ne $expected) { $failures += "$exe product version $($info.ProductVersion)" }
          }

          $msi = Get-ChildItem -Path release -Filter "ReportMate-$version.msi" | Select-Object -First 1
          if (-not $msi) { throw "No ReportMate-$version.msi produced by build.ps1" }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi.FullName, 0)
          $view = $db.OpenView("SELECT Property, Value FROM Property WHERE Property='ProductVersion' OR Property='CIMIAN_PKG_FULL_VERSION'")
          $view.Execute($null)
          $props = @{}
          while ($record = $view.Fetch()) { $props[$record.StringData(1)] = $record.StringData(2) }
          $view.Close()

          $yy = $expected.Major - 2000
          $mmdd = $expected.Minor * 100 + $expected.Build
          $msiVersion = if ($mmdd -le 255) { "$yy.$mmdd.$($expected.Revision)" }
                        else { "$yy.$($expected.Minor).$($expected.Build * 100 + [math]::Floor($expected.Revision / 100))" }
          if ($props['ProductVersion'] -ne $msiVersion) { $failures += "MSI ProductVersion $($props['ProductVersion']), expected $msiVersion" }
          if ($props['CIMIAN_PKG_FULL_VERSION'] -ne $version) { $failures += "MSI full version $($props['CIMIAN_PKG_FULL_VERSION'])" }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::Version mismatch -- $_" }
            throw "$($failures.Count) version mismatch(es) against tag $version"
          }
          Write-Host "Binaries carry $version; MSI ProductVersion $msiVersion, full version $version"

      # Each package must ship the Managed Reports Runner app beside the CLI. The
      # app cannot load its XAML without resources.pri, so both are required.
      - name: Verify the app is in every package
        shell: pwsh
        run: |
          $required = @('Managed Reports Runner.exe', 'resources.pri', 'managedreportsrunner.exe')
          $failures = @()

          $msi = Get-ChildItem -Path release -Filter 'ReportMate-*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI produced by build.ps1' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi.FullName, 0)
          $view = $db.OpenView('SELECT FileName FROM File')
          $view.Execute($null)
          $msiNames = while ($record = $view.Fetch()) { ($record.StringData(1) -split '\|')[-1] }
          $view.Close()
          foreach ($name in $required) {
            if ($msiNames -notcontains $name) { $failures += "$($msi.Name): $name" }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archives = @(Get-ChildItem -Path release -Recurse -Include 'ReportMate-*.nupkg', 'ReportMate-*.zip')
          if ($archives.Count -eq 0) { throw 'No nupkg or zip produced by build.ps1' }
          foreach ($archive in $archives) {
            $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
            try {
              $names = $zip.Entries | ForEach-Object { [Uri]::UnescapeDataString($_.Name) }
              foreach ($name in $required) {
                if ($names -notcontains $name) { $failures += "$($archive.Name): $name" }
              }
            } finally { $zip.Dispose() }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::Missing from package -- $_" }
            throw "$($failures.Count) required file(s) missing from the release packages"
          }
          Write-Host "The app, resources.pri and the CLI are in $($archives.Count + 1) package(s)"

      - name: Capture build info
        id: version
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path release -Filter 'ReportMate-*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI produced by build.ps1' }
          if ($msi.Name -match '^ReportMate-(\d{4}\.\d{2}\.\d{2}\.\d{4})\.msi$') {
            $datestamp = $Matches[1]
          } else {
            throw "Could not parse datestamp version from $($msi.Name)"
          }
          $dotnetVersion = (dotnet --version).Trim()
          $osCaption = (Get-CimInstance Win32_OperatingSystem).Caption.Trim()
          $cimipkgExe = Join-Path $PWD 'cimipkg.exe'
          if (-not (Test-Path $cimipkgExe)) { throw "cimipkg.exe not found at $cimipkgExe -- build.ps1 should have downloaded it" }
          $cimipkgVersion = (& $cimipkgExe --version 2>$null | Select-Object -First 1).Trim()
          if (-not $cimipkgVersion) { throw 'cimipkg --version returned nothing' }
          "datestamp=$datestamp"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dotnet=$dotnetVersion"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "os=$osCaption"                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cimipkg=$cimipkgVersion"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "datestamp: $datestamp"
          Write-Host "dotnet:    $dotnetVersion"
          Write-Host "os:        $osCaption"
          Write-Host "cimipkg:   $cimipkgVersion"

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem -Path release -Recurse -Include '*.msi','*.nupkg','*.intunewin','*.zip' | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $datestamp = '${{ steps.version.outputs.datestamp }}'
          $dotnet = '${{ steps.version.outputs.dotnet }}'
          $os = '${{ steps.version.outputs.os }}'
          $cimipkg = '${{ steps.version.outputs.cimipkg }}'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $title = "ReportMate $datestamp"

          $buildInfo = @"
          ## Build info

          This release was built with .NET SDK $dotnet on $os, using cimian-pkg $cimipkg, via a GitHub Actions workflow here: $runUrl. It is provided **unsigned** -- see signing instructions at the bottom.
          "@

          $signing = @"
          ## Signing for enterprise deployment

          Sign the binaries and MSI with your organization's code signing certificate before distribution:

          ``````powershell
          `$cert = "Your Certificate Name"
          `$timestampUrl = "http://timestamp.digicert.com"

          # Sign all binaries (run after extracting the MSI payload)
          Get-ChildItem -Recurse -Include *.exe,*.dll | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }

          # Sign the MSI installer (run separately, after binaries are signed and repackaged)
          Get-ChildItem -Filter "ReportMate-*.msi" | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }
          ``````

          Built from commit ``$env:GITHUB_SHA``.
          "@

          $autoNotes = gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body
          $autoNotes = ($autoNotes -join "`n") -replace ' by @[\w-]+ in ', ' in '
          $autoNotes = ($autoNotes -split "`n" | Where-Object { $_ -notmatch '^#+ New Contributors' -and $_ -notmatch 'made their first contribution' }) -join "`n"
          $notes = "$buildInfo`n`n$autoNotes`n`n$signing"

          $artifacts = Get-ChildItem -Path release -Recurse -Include '*.msi','*.nupkg','*.intunewin','*.zip' | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw 'No artifacts to upload' }
          gh release create $tag @artifacts --title $title --notes $notes
