name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Validate policy templates
        shell: pwsh
        run: |
          foreach ($f in 'resources/ReportMate.admx', 'resources/en-US/ReportMate.adml') {
            [xml](Get-Content -Raw $f) | Out-Null
            Write-Host "OK: $f"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (regenerates Generated/ModuleVersions.g.cs)
        shell: pwsh
        run: .\build.ps1 -NoSign -SkipMSI -SkipNUPKG -SkipZIP -Configuration Release

      # Runs after the build because the test project references the client, which
      # does not compile until build.ps1 has generated Generated/ModuleVersions.g.cs.
      - name: Test
        shell: pwsh
        run: dotnet test tests\ReportMate.WindowsClient.Tests\ReportMate.WindowsClient.Tests.csproj --configuration Release --logger "console;verbosity=normal"
